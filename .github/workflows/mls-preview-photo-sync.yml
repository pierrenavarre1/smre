name: Preview MLS photo sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-mls-photo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Advance preview-only MLS sync
        env:
          PREVIEW_SYNC_URL: https://smre-git-mls-incremental-sync-preview-st-mary-s-real-estate.vercel.app/api/mls-preview-sync
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 330 --output "$response_file" --write-out '%{http_code}' "$PREVIEW_SYNC_URL")"
          cat "$response_file"
          rm -f "$response_file"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Preview MLS sync returned HTTP $status" >&2
            exit 1
          fi
